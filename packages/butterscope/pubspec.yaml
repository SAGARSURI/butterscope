name: butterscope
description: Records every frame Flutter renders during a test run and reports jank per flow.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

# The native reads of thermal state, power saving, model and OS version
# (lib/src/device_state.dart). No third-party code.
flutter:
  plugin:
    platforms:
      android:
        package: dev.butterscope.butterscope
        pluginClass: ButterscopePlugin
      ios:
        pluginClass: ButterscopePlugin
