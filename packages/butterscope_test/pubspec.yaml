name: butterscope_test
description: Attaches Butterscope to Flutter integration tests with one line.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

dependencies:
  butterscope:
    path: ../butterscope
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # TestHandle.current.name, the public way to read the running test's
  # name. flutter_test pins the version (0.7.12 in Flutter 3.47.5).
  test_api: ^0.7.12

dev_dependencies:
  very_good_analysis: ^11.0.0
