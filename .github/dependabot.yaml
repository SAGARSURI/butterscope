# Keeps the GitHub Actions used in .github/workflows, and the code-health
# tools in the root pubspec.yaml, up to date.
#
# Dependabot reads this file from the default branch only, so a change here
# takes effect once it lands on main.
#
# Other pub dependencies are bumped by hand for now: a new very_good_analysis
# release can add lint rules that fail CI, so we take those on purpose.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request per week for all action bumps, titled "ci: ...".
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # cognitive_complexity, dedupe and undead, which tool/analytica.sh runs
  # and the root pubspec.yaml and pubspec.lock pin.
  # A new release can report code the old one passed, so each tool gets its
  # own pull request, titled "build: ...", and its CI run shows what the new
  # version reports before it is merged.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "cognitive_complexity"
      - dependency-name: "dedupe"
      - dependency-name: "undead"
    commit-message:
      prefix: "build"
