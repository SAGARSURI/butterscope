name: Claude review

# Claude reviews each pull request that is ready for review: correctness
# bugs, plus the rules in docs/review-rules.md.
#
# Needs the Claude GitHub app on this repository and a
# CLAUDE_CODE_OAUTH_TOKEN Actions secret (made with `claude setup-token`).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push to the pull request replaces a review still in progress.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait until they are ready. Dependabot's pull requests get no
    # secrets, so the review could not sign in; CI checks those.
    if: ${{ !github.event.pull_request.draft && github.actor != 'dependabot[bot]' }}
    # Pinned, not ubuntu-latest, as in ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # The action trades the workflow's OIDC token for the Claude app's
      # GitHub token, so comments come from the app.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The rules come from the base branch, so a pull request that changes
      # them is still reviewed against the rules it started from, and the
      # change applies from the next pull request.
      - name: Read the base branch's review rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:docs/review-rules.md" > "$RUNNER_TEMP/review-rules.md"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The repository is checked out at the
            pull request's merge commit; AGENTS.md describes the project.

            1. Read the review rules in ${{ runner.temp }}/review-rules.md
               (the base branch's docs/review-rules.md). Apply each rule in
               its "Rule definitions" section, within that rule's scope, to
               code this pull request adds or changes. Leave unchanged code
               alone.
            2. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`
               and read the changed files in full, so functions and classes
               are measured whole.
            3. Also look for correctness bugs in the changed code: wrong
               results, crashes, unhandled errors and edge cases, races, and
               tests that do not test what they claim. Report only what you
               can explain with a concrete failing input or sequence. Leave
               style to the analyzer.
            4. Each push runs this review again. Before commenting, list the
               comments already on the pull request with
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
               and do not repeat a finding already posted for the same code.
            5. Post each new finding as an inline comment on the line where
               the problem starts, using
               mcp__github_inline_comment__create_inline_comment with
               confirmed: true. For a rule, give its id, severity, the
               measured value and the threshold, and a change that brings it
               back under. For a bug, give the failing case and a fix.
            6. Finish with one summary comment:
               `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file <file>`.
               List this run's findings by severity, or say there are none,
               and name the commit reviewed (${{ github.event.pull_request.head.sha }}).
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
