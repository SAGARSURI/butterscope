name: CI

# Every branch lives in this repo, so push runs cover pull requests too:
# their results show on the PR's head commit.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Failures are also reported as annotations: they show inline on a pull
# request and can be read without opening the job log.
jobs:
  analyze-and-test:
    # Pinned, not ubuntu-latest, so the host image changes only on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve workspace
        run: flutter pub get

      # The Flutter tool can rewrite project files (for example, its
      # analysis_options.yaml migration). A clean checkout must stay clean.
      - name: Tools left the repository unchanged
        run: |
          if ! git diff --quiet; then
            for file in $(git diff --name-only); do
              diff=$(git diff -- "$file" | tool/ci/escape.sh)
              echo "::error file=$file,title=Changed by flutter pub get::Commit this change.%0A$diff"
            done
            exit 1
          fi

      - name: Check formatting
        run: |
          dart format . > /dev/null
          if ! git diff --quiet; then
            for file in $(git diff --name-only); do
              diff=$(git diff -- "$file" | tool/ci/escape.sh)
              echo "::error file=$file,title=Not formatted::Run dart format.%0A$diff"
            done
            exit 1
          fi

      - name: Analyze
        run: |
          if flutter analyze --fatal-infos > analyze.log 2>&1; then
            cat analyze.log
            exit 0
          fi
          cat analyze.log
          echo "::error title=flutter analyze::$(tool/ci/escape.sh < analyze.log)"
          sed -nE 's/^ *(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • ([a-z0-9_]+)$/::error file=\3,line=\4,col=\5,title=\6::\2/p' analyze.log
          exit 1

      - name: Host tests
        run: |
          status=0
          for dir in packages/* tools/* apps/*; do
            [ -d "$dir/test" ] || { echo "No tests in $dir yet"; continue; }
            if grep -q "sdk: flutter" "$dir/pubspec.yaml"; then
              runner="flutter test"
            else
              runner="dart test"
            fi
            echo "::group::$dir"
            if (cd "$dir" && $runner --reporter expanded) > test.log 2>&1; then
              echo "::notice title=Tests in $dir::$(tail -n 1 test.log | tool/ci/escape.sh)"
            else
              status=1
              echo "::error title=Tests failed in $dir::$(tail -n 300 test.log | tool/ci/escape.sh)"
            fi
            cat test.log
            echo "::endgroup::"
          done
          exit $status

  # The one check that branch protection requires. It waits for every job
  # above and passes only when all of them succeeded, so a new job (the
  # device run in M3, the judge in M9) is added to `needs` here and the
  # branch settings never change.
  #
  # `always()` makes it run even when a job fails; without it this job would
  # be skipped, and GitHub counts a skipped required check as passing. A
  # skipped job fails it too, because none of our jobs are meant to skip.
  required:
    name: required
    if: ${{ always() }}
    needs:
      - analyze-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::Not every job succeeded."
            exit 1
          fi
