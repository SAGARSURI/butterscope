name: CI

# Every branch lives in this repo, so push runs cover pull requests too:
# their results show on the PR's head commit.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Failures are also reported as annotations: they show inline on a pull
# request and can be read without opening the job log.
jobs:
  analyze-and-test:
    # Pinned, not ubuntu-latest, so the host image changes only on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The root pubspec points Melos at FVM's SDK link, which CI does not
      # have; "auto" uses the Flutter SDK set up below.
      MELOS_SDK_PATH: auto
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      # Any Melos 8 works here: it hands over to the version pinned in
      # pubspec.lock. A lock with no melos entry makes that hand-over crash
      # (in cli_launcher), so commit pubspec.lock whenever melos changes.
      - name: Install Melos
        run: |
          dart pub global activate melos 8.9.0
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          flutter --version
          melos --version

      - name: Bootstrap workspace
        id: bootstrap
        run: melos bootstrap

      # Each check from here on runs even when one before it failed, so one
      # run reports every failure. Each needs the workspace bootstrapped.
      #
      # Bootstrap resolves the workspace with pub get, so it can rewrite
      # project files (pubspec.lock, shared versions in a package's
      # pubspec.yaml, the Flutter tool's analysis_options.yaml migration) or
      # create new ones. A clean checkout must stay clean, untracked files
      # included.
      - name: Tools left the repository unchanged
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          [ -z "$changes" ] && exit 0
          echo "$changes"
          echo "$changes" | cut -c4- | while read -r file; do
            # GitHub cuts an annotation at about 4 KB: show the start there
            # and all of it in the job log.
            if git ls-files --error-unmatch -- "$file" > /dev/null 2>&1; then
              title="Changed by melos bootstrap"
              echo "::group::$file (diff)"; git diff -- "$file"; echo "::endgroup::"
              body=$(git diff -- "$file" | head -c 3000 | tool/ci/escape.sh)
            else
              title="Created by melos bootstrap"
              echo "::group::$file"; cat "$file"; echo "::endgroup::"
              body=$(head -c 3000 "$file" | tool/ci/escape.sh)
            fi
            echo "::error file=$file,title=$title::Commit this change, or ignore the file if it is generated. The first 3 KB:%0A%0A$body"
          done
          exit 1

      # The whole repository, not only the workspace packages that
      # `melos format` covers, so a Dart file under tool/ or at the root is
      # checked too. dart format skips hidden folders such as .dart_tool.
      # Only Dart files are compared, so a file bootstrap changed is reported
      # by the step above alone.
      - name: Check formatting
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          dart format . > /dev/null
          if ! git diff --quiet -- '*.dart'; then
            for file in $(git diff --name-only -- '*.dart'); do
              diff=$(git diff -- "$file" | tool/ci/escape.sh)
              echo "::error file=$file,title=Not formatted::Run dart format . at the repository root.%0A$diff"
            done
            exit 1
          fi

      # One pass over the whole workspace, so the paths in annotations are
      # relative to the repository root; `melos run check` runs the same
      # command. Logs go to the runner's temp folder, outside the checkout.
      - name: Analyze
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          log="$RUNNER_TEMP/analyze.log"
          if flutter analyze --fatal-infos > "$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          cat "$log"
          echo "::error title=flutter analyze::$(tool/ci/escape.sh < "$log")"
          sed -nE 's/^ *(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • ([a-z0-9_]+)$/::error file=\3,line=\4,col=\5,title=\6::\2/p' "$log"
          exit 1

      # Melos runs tool/ci/test_package.sh in every package with a test
      # folder. It annotates a failing test on the line that declares it, and
      # posts each package's result as a notice.
      - name: Host tests
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: melos run test:ci --no-select

      # tool/analytica.sh compiles each tool into .dart_tool/analytica the
      # first time it is needed, about half a minute each. The build only
      # changes with pubspec.lock (which pins the tools) and .fvmrc (the
      # SDK), so the cache keeps it until one of them does.
      - name: Cache the tools
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: .dart_tool/analytica
          key: analytica-exe-${{ hashFiles('pubspec.lock', '.fvmrc') }}

      # The root pubspec.yaml pins the tools, and tool/analytica.sh sets
      # their limits. Each finding is annotated where it starts, and each
      # tool's report is on the run's summary page.
      - name: Complexity
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: melos run complexity -- --github

      - name: Duplication
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: melos run duplication -- --github

      - name: Dead code
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: melos run dead-code -- --github

  # The one check that branch protection requires. It waits for every job
  # above and passes only when all of them succeeded, so a new job (the
  # device run in M3, the judge in M9) is added to `needs` here and the
  # branch settings never change.
  #
  # `always()` makes it run even when a job fails; without it this job would
  # be skipped, and GitHub counts a skipped required check as passing. A
  # skipped job fails it too, because none of our jobs are meant to skip.
  required:
    name: required
    if: ${{ always() }}
    needs:
      - analyze-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::Not every job succeeded."
            exit 1
          fi
