name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Host tests
        run: |
          for dir in packages/* tools/* apps/*; do
            [ -d "$dir/test" ] || { echo "No tests in $dir yet"; continue; }
            echo "::group::$dir"
            if grep -q "sdk: flutter" "$dir/pubspec.yaml"; then
              (cd "$dir" && flutter test)
            else
              (cd "$dir" && dart test)
            fi
            echo "::endgroup::"
          done
