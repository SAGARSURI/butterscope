name: butterscope_workspace
publish_to: none

environment:
  sdk: ^3.13.0

dev_dependencies:
  # The code-health tools that tool/analytica.sh runs, from
  # https://github.com/kevmoo/analytica.dart. Exact versions here, and
  # pubspec.lock pins everything they depend on, so their findings change
  # only when this file or the lock does. Dependabot proposes new releases.
  cognitive_complexity: 0.2.5
  dedupe: 0.1.0
  # Pins Melos for everyone and for CI: a globally activated Melos hands over
  # to this version.
  melos: ^8.9.0
  # undead 0.1.1, the latest release, stopped compiling when analytica 0.1.2
  # added a class named like one of undead's (ElementReferenceExtractor).
  # undead at this commit (main on 2026-10-03) uses analytica's. Move to the
  # next release once it is published; Dependabot cannot make that switch.
  undead:
    git:
      url: https://github.com/kevmoo/analytica.dart.git
      path: packages/undead
      ref: 6e927f0035ebdc44d1d7f60e2bd6d6a19d36d64a
  # The shared analysis_options.yaml at this root includes it.
  very_good_analysis: ^11.0.0

workspace:
  - packages/butterscope
  - packages/butterscope_test
  - tools/butterscope_cli
  - apps/sample

# Melos runs the workspace: `melos bootstrap`, `melos analyze`,
# `melos format`, `melos test`, and the scripts below with `melos run`.
melos:
  # The Flutter version pinned in .fvmrc; `fvm use` creates this link. CI
  # sets MELOS_SDK_PATH=auto to use the SDK it installed instead.
  sdkPath: .fvm/flutter_sdk

  command:
    bootstrap:
      # Versions every package shares, kept in one place. Bootstrap writes
      # them into each package that declares them, and CI fails when that
      # changes a file, so a package cannot drift.
      environment:
        sdk: ^3.13.0
        flutter: ">=3.47.5"
      dev_dependencies:
        very_good_analysis: ^11.0.0

  scripts:
    check:
      description: >-
        The checks CI runs after bootstrap, over the whole repository:
        formatting, analysis, tests, complexity, duplication and dead code.
        Claude Code runs it before each commit. See tool/check.sh.
      run: tool/check.sh

    complexity:
      description: >-
        Fails on a function above 15, a file over 400 lines, or a
        single-caller helper that can be inlined, and prints a split plan for
        a long file (cognitive_complexity). See tool/analytica.sh.
      run: tool/analytica.sh complexity

    duplication:
      description: >-
        Fails on any block of code that appears more than once under lib/
        (dedupe). See tool/analytica.sh.
      run: tool/analytica.sh duplication

    dead-code:
      description: >-
        Fails on any declaration that nothing reaches, package by package
        (undead). See tool/analytica.sh.
      run: tool/analytica.sh dead-code

    test:ci:
      description: >-
        For CI. Tests each package with a JSON report, so a failure is
        annotated on the test that failed.
      exec:
        command: $MELOS_ROOT_PATH/tool/ci/test_package.sh
        # One at a time keeps each package's output whole and unprefixed,
        # which GitHub needs to read the annotations.
        concurrency: 1
      packageFilters:
        dirExists: test
