name: butterscope_sample
description: Domain-neutral sample app used to prove Butterscope.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  butterscope:
    path: ../../packages/butterscope
  butterscope_test:
    path: ../../packages/butterscope_test
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  image: ^4.10.1
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
  shaders:
    - shaders/gpu_heavy.frag
