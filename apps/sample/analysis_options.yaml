include: ../../analysis_options.yaml

analyzer:
  # The Flutter tool adds these to an app on `pub get` when they are missing,
  # so they are kept here to leave the repository unchanged after it runs.
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # An app has no public API for others to read; very_good_analysis
    # suggests turning this off for apps.
    public_member_api_docs: false
